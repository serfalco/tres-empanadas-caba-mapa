<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mapa CABA · Tres Empanadas</title>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <header>
          <h1>Mapa cultural CABA</h1>
          <p class="sub">Tres Empanadas · investigación de sede</p>
        </header>
        <section>
          <label class="campo">
            <span>Buscar</span>
            <input id="buscar" type="search" placeholder="Nombre o dirección" autocomplete="off" />
          </label>
          <label class="campo">
            <span>Barrio</span>
            <select id="barrio"><option value="">Todos</option></select>
          </label>
        </section>
        <section>
          <h2>Capas</h2>
          <ul id="capas"></ul>
        </section>
        <section>
          <p id="resumen" class="nota"></p>
          <details>
            <summary>Sin coordenadas válidas (<span id="n-pendientes">0</span>)</summary>
            <ul id="pendientes" class="pendientes"></ul>
          </details>
        </section>
        <footer class="nota">
          Datos: <a href="https://data.buenosaires.gob.ar/dataset/espacios-culturales" target="_blank" rel="noopener">BA Data, Ministerio de Cultura GCBA</a> (CC-BY 2.5 AR). Sin verificación propia.
          Cartografía © colaboradores de OpenStreetMap.
        </footer>
      </aside>
      <button id="toggle-panel" aria-label="Mostrar u ocultar panel">☰</button>
      <main id="mapa"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
